name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Release and UiValidation
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: "6.12.1"

      - name: Cache fixed NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('RadeonTuner/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore packages.config
        shell: pwsh
        run: |
          nuget restore RadeonTuner.sln -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed." }

      - name: Static localization and layout checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools\verify-localization.ps1
          if ($LASTEXITCODE -ne 0) { throw "Localization check failed." }
          pwsh -NoProfile -File tools\verify-ui-layout.ps1
          if ($LASTEXITCODE -ne 0) { throw "Layout check failed." }

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found." }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found on the runner." }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $msbuild -version

      - name: Build Release x64
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH RadeonTuner.sln /m:2 /p:Configuration=Release /p:Platform=x64 /p:SignOutput=false /p:WindowsTargetPlatformVersion=10.0.26100.0
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }

      - name: Package production single EXE
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools\Portable\Build-Portable.ps1 `
            -OutFile "$env:GITHUB_WORKSPACE\.build-work\artifacts\RadeonTuner-简体中文版.exe" `
            -LogPath "$env:GITHUB_WORKSPACE\.build-work\portable-build-production.log"
          if ($LASTEXITCODE -ne 0) { throw "Production packaging failed." }

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadeonTuner-zh-CN-prod
          if-no-files-found: error
          retention-days: 7
          path: |
            .build-work/artifacts/RadeonTuner-简体中文版.exe
            .build-work/portable-build-report-production.json
            .build-work/portable-build-production.log

      - name: Build UiValidation x64
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH RadeonTuner.sln /m:2 /p:Configuration=Release /p:Platform=x64 /p:UiValidation=true /p:SignOutput=false /p:WindowsTargetPlatformVersion=10.0.26100.0
          if ($LASTEXITCODE -ne 0) { throw "UiValidation build failed." }

      - name: Package isolated UiValidation EXE
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools\Portable\Build-Portable.ps1 -UiValidation `
            -OutFile "$env:GITHUB_WORKSPACE\.build-work\artifacts\RadeonTuner-简体中文版-Validation.exe" `
            -LogPath "$env:GITHUB_WORKSPACE\.build-work\portable-build-validation.log"
          if ($LASTEXITCODE -ne 0) { throw "UiValidation packaging failed." }

      - name: Write build summary
        shell: pwsh
        run: |
          $production = Get-Item ".build-work\artifacts\RadeonTuner-简体中文版.exe"
          $validation = Get-Item ".build-work\artifacts\RadeonTuner-简体中文版-Validation.exe"
          $productionHash = (Get-FileHash -LiteralPath $production.FullName -Algorithm SHA256).Hash
          $validationHash = (Get-FileHash -LiteralPath $validation.FullName -Algorithm SHA256).Hash
          @"
          ### RadeonTuner cloud build
          - Runner: windows-2025-vs2026
          - Release and UiValidation were built separately.
          - Static localization/layout checks passed.
          - The official core was never launched on the runner.
          - Production EXE: $($production.Length) bytes, SHA256 $productionHash
          - Validation EXE: $($validation.Length) bytes, SHA256 $validationHash
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload isolated validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadeonTuner-zh-CN-validation
          if-no-files-found: error
          retention-days: 7
          path: |
            .build-work/artifacts/RadeonTuner-简体中文版-Validation.exe
            .build-work/portable-build-report-validation.json
            .build-work/portable-build-validation.log
