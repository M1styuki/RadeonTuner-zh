name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - name: Prepare release asset
        shell: pwsh
        run: |
          Copy-Item target/release/radeon-tuner.exe RadeonTuner.exe
          $hash = (Get-FileHash RadeonTuner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RadeonTuner.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RadeonTuner
          path: |
            RadeonTuner.exe
            SHA256SUMS.txt
          if-no-files-found: error
