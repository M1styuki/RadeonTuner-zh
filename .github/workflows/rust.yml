name: Rust Windows
on:
  push:
    branches: [rust-gpui, rust-gpui-fixes]
    tags: ['rust-v*']
  pull_request:
    branches: [rust-gpui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - name: Locate the fan UI test executable
        if: github.ref == 'refs/heads/rust-gpui-fixes'
        shell: pwsh
        run: |
          $output = cargo test --locked --release --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = $output | ConvertFrom-Json | Where-Object { $_.profile.test -and $_.target.name -eq 'radeon-tuner' -and $_.executable }
          if (@($test).Count -ne 1) { throw 'Expected one RadeonTuner test executable.' }
          Copy-Item -LiteralPath $test.executable -Destination RadeonTuner-Fan-UI-Test.exe
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/rust-gpui-fixes'
        with:
          name: RadeonTuner-Fan-UI-Test
          path: RadeonTuner-Fan-UI-Test.exe
          if-no-files-found: error
      - name: Prepare Rust release asset
        shell: pwsh
        run: |
          Copy-Item target/release/radeon-tuner.exe RadeonTuner-Rust-x64.exe
          $hash = (Get-FileHash RadeonTuner-Rust-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RadeonTuner-Rust-x64.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -ne "rust-v$($metadata.packages[0].version)") {
              throw 'Rust tag must match the Cargo package version.'
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RadeonTuner-Rust-Windows-x64
          path: |
            RadeonTuner-Rust-x64.exe
            SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RadeonTuner-Rust-Windows-x64
      - name: Create the Rust draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag RadeonTuner-Rust-x64.exe SHA256SUMS.txt --verify-tag --draft --latest=false --title "RadeonTuner $($tag.Substring(6)) · Rust + GPUI" --notes "Windows x64. SHA-256 is in SHA256SUMS.txt."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
