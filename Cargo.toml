[package]
name = "radeon-tuner"
version = "0.75.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui = "=0.2.2"
libc = "0.2"
libloading = "0.8"
serde = {version="1",features=["derive"]}
serde_json = "1"
tempfile = "3"
tray-icon = "0.21"
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_System_Threading","Win32_System_Services","Win32_Security","Win32_System_LibraryLoader","Win32_System_Diagnostics_ToolHelp","Win32_System_Registry","Win32_Storage_FileSystem","Win32_UI_Shell","Win32_System_Com"] }
self-replace = "1.5.1"
sha2 = "0.10.9"
semver = "1.0.28"

[profile.release]
strip = "symbols"
