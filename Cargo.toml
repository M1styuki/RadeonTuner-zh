[package]
name = "radeon-tuner"
version = "0.72.0-alpha.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui = "=0.2.2"
libc = "0.2"
libloading = "0.8"
serde_json = "1"
tempfile = "3"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["ico"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_System_Threading","Win32_Security","Win32_System_LibraryLoader"] }

[profile.release]
strip = "symbols"
